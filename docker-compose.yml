# ==============================================================================
# Cross-platform Compose file — works the same on macOS (Intel & Apple Silicon),
# Linux (amd64 & arm64) and Windows (Docker Desktop / WSL2).
#
# This runs the FULL Ducta app in one container: the `server` image (ducta-server)
# serves the compiled web app and the API on the same port (single origin — the
# same thing `ducta-server` does natively). Use this whenever the native install misbehaves on
# your OS.
#
# Portability choices:
#   • No `version:` key — Compose v2 (the `docker compose` plugin) ignores it.
#   • A named volume (ducta-data) instead of a host bind-mount, so there are no
#     Windows path / permission differences and Docker manages ownership.
#   • The image builds natively for the host CPU (no `platform:` pin).
#   • Every setting has a default, so `docker compose up` runs with no .env file.
#
# Quick start (any OS):
#   docker compose up --build
#   open http://localhost:8000/          # the Ducta UI
#   #    http://localhost:8000/docs      # API docs   ·   /health = liveness
# Optional: copy .env.example to .env to override ports / settings.
#
# With accounts (AUTH_ENABLED=true) keep them in PostgreSQL, not in the SQLite file:
# pipelines run as the container's user and could rewrite that file (roles included),
# so the server refuses SQLite with accounts in production. In .env:
#   AUTH_ENABLED=true  JWT_SECRET_KEY=<long random>  DUCTA_ADMIN_PASSWORD=<yours>
#   POSTGRES_PASSWORD=<yours>
#   DATABASE_URL=postgresql+asyncpg://ducta:<POSTGRES_PASSWORD>@postgres:5432/ducta
# and start with:  docker compose --profile accounts up --build
# ==============================================================================

services:

  # ---------------------------------------------------------------
  # Ducta — web app + API on one port (served by `ducta-server`)
  # ---------------------------------------------------------------
  ducta:
    build:
      context: .
      dockerfile: Dockerfile
      target: server           # lean production image (dev override builds the `dev` stage)
    image: ducta-server:latest
    container_name: ducta
    # Same entry point the CLI uses; the image's default CMD is identical, so
    # this is here only to make the run explicit and overridable.
    command: ["--host", "0.0.0.0", "--port", "8000", "--no-browser"]
    ports:
      - "${API_PORT:-8000}:8000"       # UI + API
      - "${SPARK_UI_PORT:-4040}:4040"  # Spark UI (when a pipeline runs a Spark job)
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      # Execution history persists on the named volume by default; override or
      # set empty to disable.
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////ducta/data/ducta.db}
      - LAKE_BASE_PATH=/ducta/data/lake
    volumes:
      - ducta-data:/ducta/data
    restart: unless-stopped
    healthcheck:
      # Uses the container's Python (no curl/wget), so it is identical on every host.
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  # ---------------------------------------------------------------
  # PostgreSQL for accounts and run history (profile "accounts"). Its URL is
  # withheld from pipeline processes, unlike a SQLite file on their disk.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16
    profiles: ["accounts"]
    environment:
      - POSTGRES_USER=ducta
      - POSTGRES_DB=ducta
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}   # postgres refuses to start without one
    volumes:
      - ducta-pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ducta -d ducta"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ducta-data:
  ducta-pg:

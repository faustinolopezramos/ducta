# ==============================================================================
# DEV override — loaded automatically by `docker compose up` (no flags needed).
#
# Turns the stack into a live development environment built on the miniconda
# `dev` image: your local ./src and ./server/src are mounted into the container and the API
# hot-reloads on save. Nothing to install on your machine — no Python, Java,
# Spark or Poetry setup. Just:
#
#     docker compose up --build      # first time (builds the dev image)
#     docker compose up              # afterwards
#     # edit files under src/ or server/src/ … the server reloads automatically
#
# Run the test suite in the same environment:
#     docker compose run --rm ducta pytest
#     docker compose run --rm ducta pytest tests/path/to/test.py -k my_case
#
# Open a shell with everything installed:
#     docker compose run --rm ducta bash
#
# It runs as ENVIRONMENT=development with authentication off, for your machine
# only. The web app is not built here: build it once on the host
# (cd server/ui && npm ci && npm run build) and the server serves it.
#
# For the deployable server instead (baked image with the web app, accounts,
# PostgreSQL), use only the base file — see its header:
#     docker compose -f docker-compose.yml --profile accounts up --build
# ==============================================================================

services:
  ducta:
    image: ducta:dev
    environment:
      # The base file defaults to production, which refuses the default JWT key.
      # This setup is local and has no accounts.
      - ENVIRONMENT=development
    build:
      target: dev                 # the miniconda contributor image (see Dockerfile)
    # dev image has no ENTRYPOINT, so run the reload server directly.
    command:
      - uvicorn
      - ducta_server.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /workspace/src
      - --reload-dir
      - /workspace/server/src
    volumes:
      - ./src:/workspace/src                # the engine and the CLI, live
      - ./server/src:/workspace/server/src  # the server, live
      - ./tests:/workspace/tests   # so `pytest` sees your tests
      - ducta-data:/ducta/data

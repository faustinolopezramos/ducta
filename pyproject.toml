[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ==============================================================================
# Project metadata
# ==============================================================================
[tool.poetry]
name = "ducta"
version = "0.3.0"
description = "A unified data-pipeline framework for batch, streaming, ML, and hybrid workflows."
authors = ["Faustino Lopez Ramos <faustinolopezramos@gmail.com>"]
maintainers = ["Faustino Lopez Ramos <faustinolopezramos@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://github.com/faustinolopezramos/ducta"
repository = "https://github.com/faustinolopezramos/ducta"
documentation = "https://github.com/faustinolopezramos/ducta/tree/main/docs"
keywords = [
    "data-pipeline",
    "etl",
    "spark",
    "streaming",
    "orchestration",
    "workflow",
    "data-quality",
    "mlops",
]
classifiers = [
    # First public release: alpha until the API is declared stable.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]

packages = [
    { include = "ducta", from = "src" },
]

include = [
    { path = "src/ducta/ui/dist", format = ["sdist", "wheel"] },
]

exclude = [
    "src/ducta/**/__pycache__",
    "src/ducta/ui/node_modules",
    "src/ducta/ui/src",
    "src/ducta/ui/ds-bundle",
    "src/ducta/ui/.ds-sync",
    "src/ducta/ui/.design-sync",
    "src/ducta/ui/.storybook",
    "src/ducta/ui/.storybook-static",
    "src/ducta/ui/*.ts",
    "src/ducta/ui/*.d.ts",
    "src/ducta/ui/*.tsbuildinfo",
    "src/ducta/ui/*.json",
    "src/ducta/ui/*.html",
    "src/ducta/ui/README.md",
    "**/.DS_Store",
    "src/ducta/core/README.md",
    "src/ducta/mlrun/README.md",
    "src/ducta/stream/README.md",
    "src/ducta/gate/README.md",
    "src/ducta/api/README.md",
    "src/ducta/setting/README.md",
    "src/ducta/check/README.md",
    "src/ducta/console/README.md",
]

[tool.poetry.urls]
"Source" = "https://github.com/faustinolopezramos/ducta"
"Issues" = "https://github.com/faustinolopezramos/ducta/issues"
"Changelog" = "https://github.com/faustinolopezramos/ducta/blob/main/CHANGELOG.md"
[tool.poetry.dependencies]
python = ">=3.10,<3.14"

loguru = "^0.7.0"
PyYAML = "^6.0"
pandas = "^2.0.0"
python-dotenv = "^1.0.0"
typing-extensions = "^4.3.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
rich = "^13.0.0"
tomli = { version = "^1.2.0", python = "<3.11" }
tomli-w = "^1.0.0"
sqlglot = ">=23.0.0,<31.0.0"
pyspark = { version = "^3.5.0", optional = true }
pyarrow = { version = ">=15.0.0,<20.0.0", optional = true }
setuptools = { version = ">=68.0.0", python = ">=3.12", optional = true }

# --- API server (extra: api) ---
fastapi = { version = ">=0.104.0,<1.0.0", optional = true }
msgpack = { version = "^1.0.0", optional = true }
uvicorn = { version = "^0.23.0", extras = ["standard"], optional = true }
# PyJWT rather than python-jose: python-jose pulls in `ecdsa`, whose Minerva
# timing vulnerability (CVE-2024-23342) is unfixable in pure Python and has no
# planned patch. Ducta only ever signs with HS256, so the ECDSA code was dead
# weight that every dependency scanner flagged. PyJWT delegates to `cryptography`.
PyJWT = { version = "^2.8.0", optional = true }
bcrypt = { version = "^4.0.0", optional = true }

# --- Database persistence (extra: database) ---
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"], optional = true }
alembic = { version = "^1.14.0", optional = true }
aiosqlite = { version = "^0.20.0", optional = true }
asyncpg = { version = "^0.30.0", optional = true }
psycopg2-binary = { version = "^2.9.0", optional = true }

# --- Infrastructure (extra: api) ---
GitPython = { version = "^3.1.0", optional = true }
watchdog = { version = "^4.0.0", optional = true }
redis = { version = "^5.0.0", optional = true }
# Round-trip YAML for API edits of format-2 projects: keeps the comments and
# key order of files people also edit by hand.
"ruamel.yaml" = { version = ">=0.18,<0.19", optional = true }

# --- MLOps (extra: mlops) ---
mlflow = { version = "^2.10.0", optional = true }
scikit-learn = { version = "^1.3.0", optional = true }
numpy = { version = "^1.24.0", optional = true }
scipy = { version = "^1.11.0", optional = true }
optuna = { version = "^3.4.0", optional = true }

# --- Delta Lake (extra: delta) — the Python API for write_mode: merge. The
# jar itself is resolved by the local session (setting/session.py
# local_delta_configs) to the build matching the installed PySpark; this pin
# keeps the Python package on the same major as that jar (Delta 3.x ↔ Spark 3.5).
delta-spark = { version = "^3.2.0", optional = true }

# --- Databricks Connect (extra: databricks — MUTUALLY EXCLUSIVE with `spark`) ---
databricks-connect = { version = "^14.0.0", optional = true }

# --- Monitoring (extra: monitoring) ---
prometheus-client = { version = "^0.17.0", optional = true }

[tool.poetry.extras]
spark = ["pyspark", "pyarrow", "setuptools"]
api = [
    "fastapi", "uvicorn", "PyJWT", "bcrypt", "msgpack",
    "sqlalchemy", "alembic", "aiosqlite", "asyncpg", "psycopg2-binary",
    "GitPython", "watchdog", "redis", "ruamel.yaml",
]
database = ["sqlalchemy", "alembic", "aiosqlite", "asyncpg", "psycopg2-binary"]
mlops = ["mlflow", "scikit-learn", "numpy", "scipy", "optuna"]
monitoring = ["prometheus-client"]
databricks = ["databricks-connect"]
delta = ["delta-spark"]
all = [
    "pyspark", "pyarrow", "setuptools", "delta-spark",
    "fastapi", "uvicorn", "PyJWT", "bcrypt", "msgpack",
    "sqlalchemy", "alembic", "aiosqlite", "asyncpg", "psycopg2-binary",
    "GitPython", "watchdog", "redis", "ruamel.yaml",
    "mlflow", "scikit-learn", "numpy", "scipy", "optuna",
    "prometheus-client",
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
ruff = "^0.4.0"
httpx = ">=0.24"
pre-commit = "^3.7.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0"
furo = ">=2024.1.29"
myst-parser = "^2.0"
sphinx-copybutton = "^0.5"
sphinx-design = "^0.5"

# ==============================================================================
# Console entry point
# ==============================================================================
[tool.poetry.scripts]
ducta = "ducta.console.wrapper:main"

# ==============================================================================
# Tooling
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib --strict-markers"
# "src" puts the package under test on the path; "." puts the repo root there so
# `tests.core.fakes` — the shared fake Context/DataFrame several core tests import
# — resolves as a namespace package. Without it, only `python -m pytest` works
# (it adds the cwd itself); the bare `pytest` console script that CI runs fails
# collection with "No module named 'tests.core'".
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "spark: tests that require a real PySpark session (skipped when pyspark is absent)",
    "network: tests that intentionally perform real network I/O (e.g. JDBC driver downloads)",
]

[tool.coverage.run]
source = ["ducta"]
branch = true
omit = [
    "src/ducta/ui/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["ducta"]

[tool.ruff.format]
quote-style = "double"

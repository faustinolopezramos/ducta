[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ==============================================================================
# Project metadata
# ==============================================================================
[tool.poetry]
name = "ducta"
version = "0.3.0"
description = "A unified data-pipeline framework for batch, streaming, ML, and hybrid workflows."
authors = ["Faustino Lopez Ramos <faustinolopezramos@gmail.com>"]
maintainers = ["Faustino Lopez Ramos <faustinolopezramos@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://github.com/faustinolopezramos/ducta"
repository = "https://github.com/faustinolopezramos/ducta"
documentation = "https://github.com/faustinolopezramos/ducta/tree/main/docs"
keywords = [
    "data-pipeline",
    "etl",
    "spark",
    "streaming",
    "orchestration",
    "workflow",
    "data-quality",
    "mlops",
]
classifiers = [
    # First public release: alpha until the API is declared stable.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]

packages = [
    { include = "ducta", from = "src" },
]

exclude = [
    "src/ducta/**/__pycache__",
    "**/.DS_Store",
    "src/ducta/core/README.md",
    "src/ducta/mlrun/README.md",
    "src/ducta/stream/README.md",
    "src/ducta/gate/README.md",
    "src/ducta/setting/README.md",
    "src/ducta/check/README.md",
    "src/ducta/console/README.md",
    "src/ducta/ai/README.md",
]

[tool.poetry.urls]
"Source" = "https://github.com/faustinolopezramos/ducta"
"Issues" = "https://github.com/faustinolopezramos/ducta/issues"
"Changelog" = "https://github.com/faustinolopezramos/ducta/blob/main/CHANGELOG.md"
[tool.poetry.dependencies]
python = ">=3.11,<3.15"

loguru = "^0.7.0"
PyYAML = "^6.0"
pandas = "^2.0.0"
python-dotenv = "^1.0.0"
typing-extensions = "^4.3.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.7.0"  # NoDecode (comma-separated list env vars)
rich = ">=13.0.0,<16.0.0"
tomli-w = "^1.0.0"
sqlglot = ">=23.0.0,<31.0.0"
pyspark = [
    { version = ">=3.5.0,<4.3.0", python = "<3.14", optional = true },
    { version = ">=4.2.0,<4.3.0", python = ">=3.14", optional = true },
]
pyarrow = { version = ">=23.0.1,<27.0.0", optional = true }
setuptools = { version = ">=68.0.0", python = ">=3.12", optional = true }

"ruamel.yaml" = { version = ">=0.18,<0.20", optional = true }

# --- MLOps (extra: mlops) ---
mlflow = { version = "^3.15.0", optional = true }
scikit-learn = { version = "^1.3.0", optional = true }
numpy = [
    { version = "^1.24.0", python = "<3.13", optional = true },
    { version = ">=2.1.0,<3.0.0", python = ">=3.13", optional = true },
]
scipy = { version = "^1.11.0", optional = true }
optuna = { version = ">=3.4.0,<6.0.0", optional = true }

# --- Gradient boosting (extra: boost) — models the registry and the serving node
xgboost = { version = ">=2.0.0,<4.0.0", optional = true }
lightgbm = { version = "^4.0.0", optional = true }

# --- Delta Lake (extra: delta) — the Python API for write_mode: merge. The
delta-spark = { version = ">=3.2.0,<5.0.0", optional = true }

# --- Databricks Connect (extra: databricks — MUTUALLY EXCLUSIVE with `spark`) ---
databricks-connect = { version = "^14.0.0", optional = true }

# --- AI pipeline builder (extra: ai) — `ducta ai`. Local models (Ollama, LM Studio,
httpx = { version = ">=0.24", optional = true }
anthropic = { version = ">=1.13.0,<3.0.0", optional = true }
keyring = { version = ">=25.0.0", optional = true }

# --- Monitoring (extra: monitoring) ---
prometheus-client = { version = ">=0.17.0,<1.0.0", optional = true }

[tool.poetry.extras]
spark = ["pyspark", "pyarrow", "setuptools"]
mlops = ["mlflow", "scikit-learn", "numpy", "scipy", "optuna"]
boost = ["xgboost", "lightgbm"]
monitoring = ["prometheus-client"]
ai = ["httpx", "anthropic", "keyring", "ruamel.yaml"]
databricks = ["databricks-connect"]
delta = ["delta-spark"]
all = [
    "pyspark", "pyarrow", "setuptools", "delta-spark", "ruamel.yaml",
    "mlflow", "scikit-learn", "numpy", "scipy", "optuna",
    "xgboost", "lightgbm",
    "prometheus-client",
    "httpx", "anthropic", "keyring",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.0.0"
mypy = "^1.8.0"
types-PyYAML = "^6.0"
types-toml = "^0.10"
ruff = "^0.4.0"
httpx = ">=0.24"
pre-commit = "^3.7.0"

[tool.poetry.group.server]
optional = true

[tool.poetry.group.server.dependencies]
fastapi = ">=0.104.0,<1.0.0"
msgpack = "^1.0.0"
uvicorn = { version = ">=0.23.0,<1.0.0", extras = ["standard"] }
PyJWT = "^2.8.0"
bcrypt = ">=4.0.0,<6.0.0"
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
alembic = "^1.14.0"
aiosqlite = ">=0.20.0,<1.0.0"
asyncpg = ">=0.30.0,<1.0.0"
psycopg2-binary = "^2.9.0"
GitPython = "^3.1.0"
redis = ">=5.0.0,<9.0.0"
"ruamel.yaml" = ">=0.18,<0.20"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0"
furo = ">=2024.1.29"
myst-parser = "^2.0"
sphinx-copybutton = "^0.5"
sphinx-design = ">=0.6"

# ==============================================================================
# Console entry point
# ==============================================================================
[tool.poetry.scripts]
ducta = "ducta.console.wrapper:main"

# ==============================================================================
# Tooling
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib --strict-markers"
pythonpath = ["src", "server/src", "."]
filterwarnings = [
    "error::DeprecationWarning:ducta",
    "error::PendingDeprecationWarning:ducta",
    "error::FutureWarning:ducta",
]
markers = [
    "spark: tests that require a real PySpark session (skipped when pyspark is absent)",
    "network: tests that intentionally perform real network I/O (e.g. JDBC driver downloads)",
]

[tool.coverage.run]
source = ["ducta", "ducta_server"]
branch = true
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sphinx.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["ducta", "ducta_server"]

[tool.ruff.format]
quote-style = "double"

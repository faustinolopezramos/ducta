[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ==============================================================================
# Project metadata
# ==============================================================================
[tool.poetry]
name = "ducta"
version = "0.2.0"
description = "A unified data-pipeline framework for batch, streaming, ML, and hybrid workflows."
authors = ["Faustino Lopez Ramos <faustinolopezramos@gmail.com>"]
maintainers = ["Faustino Lopez Ramos <faustinolopezramos@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://github.com/faustinolopezramos/ducta"
repository = "https://github.com/faustinolopezramos/ducta"
documentation = "https://github.com/faustinolopezramos/ducta/tree/main/docs"
keywords = [
    "data-pipeline",
    "etl",
    "spark",
    "streaming",
    "orchestration",
    "workflow",
    "data-quality",
    "mlops",
]
classifiers = [
    # First public release: alpha until the API is declared stable.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]

packages = [
    { include = "ducta", from = "src" },
]

include = [
    { path = "src/ducta/ui/dist", format = ["sdist", "wheel"] },
]

exclude = [
    "src/ducta/**/__pycache__",
    "src/ducta/ui/node_modules",
    "src/ducta/ui/src",
    "src/ducta/ui/ds-bundle",
    "src/ducta/ui/.ds-sync",
    "src/ducta/ui/.design-sync",
    "src/ducta/ui/.storybook",
    "src/ducta/ui/.storybook-static",
    "src/ducta/ui/*.ts",
    "src/ducta/ui/*.d.ts",
    "src/ducta/ui/*.tsbuildinfo",
    "src/ducta/ui/*.json",
    "src/ducta/ui/*.html",
    "src/ducta/ui/README.md",
    "**/.DS_Store",
    "src/ducta/core/README.md",
    "src/ducta/mlrun/README.md",
    "src/ducta/stream/README.md",
    "src/ducta/gate/README.md",
    "src/ducta/api/README.md",
    "src/ducta/setting/README.md",
    "src/ducta/check/README.md",
    "src/ducta/console/README.md",
    "src/ducta/ai/README.md",
]

[tool.poetry.urls]
"Source" = "https://github.com/faustinolopezramos/ducta"
"Issues" = "https://github.com/faustinolopezramos/ducta/issues"
"Changelog" = "https://github.com/faustinolopezramos/ducta/blob/main/CHANGELOG.md"
[tool.poetry.dependencies]
python = ">=3.10,<3.14"

loguru = "^0.7.0"
PyYAML = "^6.0"
pandas = "^2.0.0"
python-dotenv = "^1.0.0"
typing-extensions = "^4.3.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.7.0"  # NoDecode (comma-separated list env vars)
rich = "^13.0.0"
tomli = { version = "^1.2.0", python = "<3.11" }
tomli-w = "^1.0.0"
sqlglot = ">=23.0.0,<31.0.0"
pyspark = { version = "^3.5.0", optional = true }
# >=23.0.1: CVE-2026-25087 (use-after-free in Arrow C++). <25: databricks-connect 14.x.
pyarrow = { version = ">=23.0.1,<25.0.0", optional = true }
setuptools = { version = ">=68.0.0", python = ">=3.12", optional = true }

# --- API server (extra: api) ---
fastapi = { version = ">=0.104.0,<1.0.0", optional = true }
msgpack = { version = "^1.0.0", optional = true }
# ">=x,<1", not "^0.x": a caret on 0.x pins the minor (uvicorn stayed on 0.23).
uvicorn = { version = ">=0.23.0,<1.0.0", extras = ["standard"], optional = true }
# PyJWT rather than python-jose: python-jose pulls in `ecdsa`, whose Minerva
# timing vulnerability (CVE-2024-23342) is unfixable in pure Python and has no
# planned patch. Ducta only ever signs with HS256, so the ECDSA code was dead
# weight that every dependency scanner flagged. PyJWT delegates to `cryptography`.
PyJWT = { version = "^2.8.0", optional = true }
bcrypt = { version = "^4.0.0", optional = true }

# --- Database persistence (extra: database) ---
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"], optional = true }
alembic = { version = "^1.14.0", optional = true }
aiosqlite = { version = ">=0.20.0,<1.0.0", optional = true }
asyncpg = { version = ">=0.30.0,<1.0.0", optional = true }
psycopg2-binary = { version = "^2.9.0", optional = true }

# --- Infrastructure (extra: api) ---
GitPython = { version = "^3.1.0", optional = true }
watchdog = { version = "^4.0.0", optional = true }
redis = { version = "^5.0.0", optional = true }
# Round-trip YAML for API edits of format-2 projects: keeps the comments and
# key order of files people also edit by hand.
"ruamel.yaml" = { version = ">=0.18,<0.19", optional = true }

# --- MLOps (extra: mlops) ---
# ^3.15: every MLflow advisory that has a fix is fixed by 3.15.0.
mlflow = { version = "^3.15.0", optional = true }
scikit-learn = { version = "^1.3.0", optional = true }
# numpy 1.26 ships no Python 3.13 wheels: 3.13 needs numpy 2.1+ or a source build.
numpy = [
    { version = "^1.24.0", python = "<3.13", optional = true },
    { version = ">=2.1.0,<3.0.0", python = ">=3.13", optional = true },
]
scipy = { version = "^1.11.0", optional = true }
optuna = { version = "^3.4.0", optional = true }

# --- Gradient boosting (extra: boost) — models the registry and the serving node
# load natively (xgboost .json/.ubj, lightgbm .txt) without trusting a pickle.
xgboost = { version = ">=2.0.0,<4.0.0", optional = true }
lightgbm = { version = "^4.0.0", optional = true }

# --- Delta Lake (extra: delta) — the Python API for write_mode: merge. The
# jar itself is resolved by the local session (setting/session.py
# local_delta_configs) to the build matching the installed PySpark; this pin
# keeps the Python package on the same major as that jar (Delta 3.x ↔ Spark 3.5).
delta-spark = { version = "^3.2.0", optional = true }

# --- Databricks Connect (extra: databricks — MUTUALLY EXCLUSIVE with `spark`) ---
databricks-connect = { version = "^14.0.0", optional = true }

# --- AI pipeline builder (extra: ai) — `ducta ai`. Local models (Ollama, LM Studio,
# vLLM) and OpenAI are reached over httpx; Claude through the official SDK. keyring
# keeps API keys in the OS keychain. Drafts are validated by the API layer, so
# install it as `ducta[api,ai]`.
httpx = { version = ">=0.24", optional = true }
anthropic = { version = ">=1.13.0,<2.0.0", optional = true }
keyring = { version = ">=25.0.0", optional = true }

# --- Monitoring (extra: monitoring) ---
prometheus-client = { version = ">=0.17.0,<1.0.0", optional = true }

[tool.poetry.extras]
spark = ["pyspark", "pyarrow", "setuptools"]
api = [
    "fastapi", "uvicorn", "PyJWT", "bcrypt", "msgpack",
    "sqlalchemy", "alembic", "aiosqlite", "asyncpg", "psycopg2-binary",
    "GitPython", "watchdog", "redis", "ruamel.yaml",
]
database = ["sqlalchemy", "alembic", "aiosqlite", "asyncpg", "psycopg2-binary"]
mlops = ["mlflow", "scikit-learn", "numpy", "scipy", "optuna"]
boost = ["xgboost", "lightgbm"]
monitoring = ["prometheus-client"]
ai = ["httpx", "anthropic", "keyring", "ruamel.yaml"]
databricks = ["databricks-connect"]
delta = ["delta-spark"]
all = [
    "pyspark", "pyarrow", "setuptools", "delta-spark",
    "fastapi", "uvicorn", "PyJWT", "bcrypt", "msgpack",
    "sqlalchemy", "alembic", "aiosqlite", "asyncpg", "psycopg2-binary",
    "GitPython", "watchdog", "redis", "ruamel.yaml",
    "mlflow", "scikit-learn", "numpy", "scipy", "optuna",
    "xgboost", "lightgbm",
    "prometheus-client",
    "httpx", "anthropic", "keyring",
]

[tool.poetry.group.dev.dependencies]
# ^9.0.3: PYSEC-2026-1845 is fixed there (dev-only; never installed for users).
pytest = "^9.0.3"
pytest-cov = "^7.0.0"
mypy = "^1.8.0"
types-PyYAML = "^6.0"
types-toml = "^0.10"
ruff = "^0.4.0"
httpx = ">=0.24"
pre-commit = "^3.7.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0"
furo = ">=2024.1.29"
myst-parser = "^2.0"
sphinx-copybutton = "^0.5"
sphinx-design = "^0.5"

# ==============================================================================
# Console entry point
# ==============================================================================
[tool.poetry.scripts]
ducta = "ducta.console.wrapper:main"

# ==============================================================================
# Tooling
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib --strict-markers"
# "src" puts the package under test on the path; "." puts the repo root there so
# `tests.core.fakes` — the shared fake Context/DataFrame several core tests import
# — resolves as a namespace package. Without it, only `python -m pytest` works
# (it adds the cwd itself); the bare `pytest` console script that CI runs fails
# collection with "No module named 'tests.core'".
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "spark: tests that require a real PySpark session (skipped when pyspark is absent)",
    "network: tests that intentionally perform real network I/O (e.g. JDBC driver downloads)",
]

[tool.coverage.run]
source = ["ducta"]
branch = true
omit = [
    "src/ducta/ui/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# A floor, not a target: 69.7% when it was set (2026-10-14). Raise it as
# coverage grows; a change that drops below it fails CI.
fail_under = 68
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true

# Installed packages whose source mypy must not parse: sphinx ships Python
# 3.12 `type` statements, which stop the whole run under python_version 3.10.
[[tool.mypy.overrides]]
module = ["sphinx.*"]
follow_imports = "skip"

# Type-checking ratchet. mypy is blocking in CI for every module except these,
# which still had errors when it was switched on (2026-10-14: 486 errors in 103
# files). Clean a module, delete its line, and mypy keeps it clean from then on.
# Never add a module here: new code type-checks.
[[tool.mypy.overrides]]
module = [
    "ducta.api.core.file_watcher",
    "ducta.api.core.git_sync",
    "ducta.api.db.models",
    "ducta.api.db.stores.execution_store",
    "ducta.api.dependencies",
    "ducta.api.execution.error_recovery",
    "ducta.api.execution.manager_dispatch",
    "ducta.api.execution.manager_lifecycle",
    "ducta.api.execution.manager_reads",
    "ducta.api.execution.manager_streaming",
    "ducta.api.middleware",
    "ducta.api.middleware.rate_limit",
    "ducta.api.repositories.pipeline_ops",
    "ducta.api.routes.auth",
    "ducta.api.routes.configs",
    "ducta.api.routes.editor",
    "ducta.api.routes.execution",
    "ducta.api.routes.mlops",
    "ducta.api.routes.projects",
    "ducta.api.services.column_lineage",
    "ducta.api.services.comments",
    "ducta.api.services.draft_validation",
    "ducta.api.services.language_server",
    "ducta.api.services.metrics",
    "ducta.api.services.node_schema_service",
    "ducta.api.services.node_tests",
    "ducta.api.services.project",
    "ducta.api.services.streaming_status",
    "ducta.api.workspace.loaders",
    "ducta.api.workspace.manager",
    "ducta.api.workspace.preflight",
    "ducta.check.advisor",
    "ducta.check.checks.business",
    "ducta.check.checks.cross_table",
    "ducta.check.checks.distribution",
    "ducta.check.checks.model",
    "ducta.check.checks.structural",
    "ducta.check.checks.temporal",
    "ducta.check.core",
    "ducta.check.engine",
    "ducta.check.profiling",
    "ducta.check.service",
    "ducta.check.storage",
    "ducta.console.cli",
    "ducta.console.commands.config_cmds",
    "ducta.console.commands.execution_cmds",
    "ducta.console.mlops_commands",
    "ducta.console.template",
    "ducta.console.ux.error_analyzer",
    "ducta.console.ux.rich_logger",
    "ducta.console.ux.schema_formatter",
    "ducta.core.commands",
    "ducta.core.context_utils",
    "ducta.core.execution.coordinator",
    "ducta.core.execution.ingestion",
    "ducta.core.execution.output",
    "ducta.core.execution.quality",
    "ducta.core.execution.runner",
    "ducta.core.execution.state",
    "ducta.core.executors.base",
    "ducta.core.executors.batch",
    "ducta.core.executors.facade",
    "ducta.core.executors.hybrid",
    "ducta.core.executors.streaming",
    "ducta.core.ledger",
    "ducta.core.mlops_integration",
    "ducta.core.node_worker",
    "ducta.core.pipeline_state",
    "ducta.core.pipeline_validator",
    "ducta.core.storage.base",
    "ducta.core.utils",
    "ducta.gate.gateway.connector",
    "ducta.gate.gateway.manager",
    "ducta.gate.gateway.service",
    "ducta.gate.gateway.spark_setup",
    "ducta.gate.input",
    "ducta.gate.output.dataframes",
    "ducta.gate.output.manager",
    "ducta.gate.output.paths",
    "ducta.gate.output.unity_catalog",
    "ducta.gate.readers",
    "ducta.gate.sql",
    "ducta.gate.writers",
    "ducta.mlrun.concurrency",
    "ducta.mlrun.config",
    "ducta.mlrun.environment",
    "ducta.mlrun.experiment_tracking",
    "ducta.mlrun.hyperparams",
    "ducta.mlrun.mlflow",
    "ducta.mlrun.model_registry",
    "ducta.mlrun.resilience",
    "ducta.mlrun.serving",
    "ducta.mlrun.split",
    "ducta.mlrun.storage",
    "ducta.mlrun.validators",
    "ducta.stream.context_utils",
    "ducta.stream.exceptions",
    "ducta.stream.pipeline_manager",
    "ducta.stream.query_manager",
    "ducta.stream.readers",
    "ducta.stream.trigger_scheduler",
    "ducta.stream.validators",
    "ducta.stream.writers",
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["ducta"]

[tool.ruff.format]
quote-style = "double"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release (release.yml) runs this whole workflow first and publishes only
  # if every job passes: a tag can point at a commit CI never saw (a release/x.y.z
  # branch), so the tests run on exactly what gets published.
  workflow_call:

concurrency:
  # `ci-` keeps this group apart from the release's own: called from release.yml,
  # github.workflow is the caller's name, and sharing a group would cancel it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Poetry that writes poetry.lock (format 2.1): 1.8 cannot read it.
  POETRY_VERSION: "2.4.1"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      # NOT --all-extras: that would pull in the `databricks` extra, whose
      # databricks-connect overwrites pyspark and breaks every Spark test.
      # `--with server`: the web server's dependencies (server/pyproject.toml),
      # so its tree (server/src) is linted and type-checked with the engine's.
      - name: Install dependencies
        run: poetry install --extras all --with server
      # F rules include F821 (undefined name). A whole module once shipped with
      # 13 undefined names because nothing ran this in CI — keep it blocking.
      - name: Ruff lint
        run: poetry run ruff check src server/src tests scripts
      # Blocking since the formatting backlog reached zero. `ruff format` is
      # deterministic, so anything it would rewrite is a diff nobody reviewed —
      # keep it a hard failure rather than let the backlog grow back.
      - name: Ruff format check
        run: poetry run ruff format --check src server/src tests scripts
      # Blocking, for every module: the ratchet list it started with in
      # 2026-10 (486 errors in 103 files) is empty and gone.
      - name: mypy
        run: poetry run mypy src/ducta server/src/ducta_server

  test:
    name: Tests (py${{ matrix.python-version }}, Spark ${{ matrix.spark }})
    runs-on: ubuntu-latest
    env:
      # Several tests chdir into a temporary project and spawn worker processes
      # (`run_in_process`, the sweep workers, the template smoke tests).
      # pytest-cov's .pth hook starts coverage inside those children, but from a
      # cwd where this pyproject.toml is not discoverable — so they record
      # statement-only data while the parent records branch data
      # (`[tool.coverage.run] branch = true`). The run then dies in the final
      # combine with "Can't combine statement coverage data with branch data",
      # *after* every test has already passed, which is why the failure reads as
      # a coverage crash rather than a test failure. Pointing every process at
      # the same config file is what makes parent and children agree.
      COVERAGE_RCFILE: ${{ github.workspace }}/pyproject.toml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # poetry.lock resolves Spark 4.2. Spark 3.5 is still supported (until its
        # end of life, 2027-11-30): one more leg runs the suite on it. `spark` is a
        # dimension of its own so that leg is added, not merged into py3.11's.
        spark: ["4.2"]
        include:
          - python-version: "3.11"
            spark: "3.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up JDK (Spark)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      # NOT --all-extras: that would pull in the `databricks` extra, whose
      # databricks-connect overwrites pyspark and breaks every Spark test.
      - name: Install dependencies
        run: poetry install --extras all --with server
      # Delta's Python package and its jar follow the Spark line: on Spark 3.5 Ducta
      # loads the delta-spark_2.12:3.2.1 jar (setting/session.py), so the Python side
      # is the same 3.2 release, not the newest 3.x.
      - name: Switch to Spark ${{ matrix.spark }}
        if: matrix.spark == '3.5'
        run: poetry run pip install "pyspark>=3.5,<3.6" "delta-spark>=3.2,<3.3"
      # The Delta jars Spark downloads through Ivy on first use. Cached, a run does not
      # depend on Maven Central answering (it once said "not found" for a jar it serves).
      - name: Cache the Spark jars (Ivy)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-spark${{ matrix.spark }}-${{ hashFiles('src/ducta/setting/session.py') }}
          restore-keys: ivy-${{ runner.os }}-spark${{ matrix.spark }}-
      - name: Run tests
        run: poetry run pytest --cov --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11' && matrix.spark == '4.2'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  # Proves both published artifacts install from a clean environment on every
  # supported Python, in the three ways a user installs them: the CLI alone, the
  # web server alone (which pulls the engine in), and both. Plain imports and
  # commands, so any dependency used but not declared fails here.
  install-matrix:
    name: Clean install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      # ── ducta: the engine and the CLI. No Node, no web app. ──────────────
      - name: Build the ducta wheel
        run: poetry build -f wheel -o dist
      - name: Assert the ducta wheel carries no server
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/ducta-[0-9]*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          leaked = [n for n in names if n.startswith(("ducta/api/", "ducta/ui/", "ducta_server/"))]
          if leaked:
              sys.exit(f"{wheel} ships server files: {leaked[:5]}")
          print(f"{wheel}: engine and CLI only")
          PY
      - name: CLI only — install and run
        run: |
          python -m venv /tmp/cli
          /tmp/cli/bin/pip install --upgrade pip
          /tmp/cli/bin/pip install "$(ls dist/ducta-[0-9]*.whl)[all]"
          /tmp/cli/bin/ducta --version
          /tmp/cli/bin/ducta --help > /dev/null
          /tmp/cli/bin/ducta init project --name shop --path /tmp/shop
          (cd /tmp/shop && /tmp/cli/bin/ducta config validate && /tmp/cli/bin/ducta list)
          /tmp/cli/bin/python - <<'PY'
          import importlib.util, sys
          import ducta, ducta.ai.providers, ducta.runs.certificates, ducta.project_store.store
          from ducta.core.executors import PipelineExecutor
          from ducta.stream.query_manager import StreamingQueryManager
          import anthropic, httpx, keyring  # the `ai` extra
          import re
          from importlib.metadata import requires
          if importlib.util.find_spec("ducta_server") is not None:
              sys.exit("the CLI install brought the server (ducta_server) in")
          # What ducta itself declares, extras included. Not what is importable:
          # mlflow (the `mlops` extra) depends on fastapi, uvicorn and sqlalchemy.
          declared = {re.split(r"[\s;<>=!~\[(]", r, maxsplit=1)[0].lower() for r in requires("ducta") or []}
          leaked = declared & {"fastapi", "uvicorn", "sqlalchemy", "ducta-server"}
          if leaked:
              sys.exit(f"ducta declares the server's dependencies: {sorted(leaked)}")
          print("CLI OK", ducta.__version__)
          PY
          # `ducta ui` without the server: says what to install, exit 5 (dependency).
          set +e; /tmp/cli/bin/ducta ui --no-browser; code=$?; set -e
          test "$code" = 5

      # ── ducta-server: the API and the web app ────────────────────────────
      # The wheel ships server/src/ducta_server/ui_dist, which is gitignored: it only
      # exists once the UI is built. Build it here so the artifact under test is the
      # artifact users get.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/ui/package-lock.json
      - name: Build the web app
        working-directory: server/ui
        run: |
          npm ci
          npm run build
      - name: Build the ducta-server wheel
        working-directory: server
        run: poetry build -f wheel -o ../dist
      - name: Assert the ducta-server wheel bundles the web app
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/ducta_server-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "ducta_server/ui_dist/index.html" not in names:
              sys.exit(f"{wheel} ships no UI: build server/ui before packaging")
          print(f"{wheel} bundles the web app")
          PY
      # pip resolves `ducta` from the wheel built above, not from PyPI.
      - name: Server only — install and start
        run: |
          python -m venv /tmp/server
          /tmp/server/bin/pip install --upgrade pip
          /tmp/server/bin/pip install "$(ls dist/ducta_server-*.whl)" --find-links dist
          /tmp/server/bin/pip show ducta-server | grep -E '^Requires:.*\bducta\b'
          /tmp/server/bin/ducta-server --version
          /tmp/server/bin/ducta-server --help > /dev/null
          /tmp/server/bin/python - <<'PY'
          from ducta_server.main import create_app
          paths = create_app().openapi()["paths"]
          assert "/health" in paths
          assert "/api/ai/settings" in paths
          print("server OK")
          PY
      - name: Both — `ducta ui` finds the server
        run: |
          /tmp/cli/bin/pip install "$(ls dist/ducta_server-*.whl)" --find-links dist
          /tmp/cli/bin/python -c "from ducta.console.ui import server_installed; assert server_installed()"

  # The image is what a deployment runs: build it and start Spark in it, so a base
  # image, Python or JDK that no longer fits is caught here and not at deploy time.
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the CLI image
        run: docker build --target cli -t ducta:ci .
      - name: Build the server image
        run: docker build --target server -t ducta-server:ci .
      - name: Smoke-test them
        run: |
          docker run --rm ducta:ci --version
          docker run --rm ducta-server:ci --version
          docker run --rm --entrypoint python ducta:ci -c "
          import importlib.util
          assert importlib.util.find_spec('ducta_server') is None, 'the CLI image ships the server'
          from pyspark.sql import SparkSession
          spark = SparkSession.builder.master('local[1]').getOrCreate()
          assert spark.range(3).count() == 3
          print('Spark', spark.version, 'runs in the image')
          spark.stop()
          "
          docker run --rm --entrypoint python ducta-server:ci -c "
          from ducta_server.main import create_app
          assert '/health' in create_app().openapi()['paths']
          print('server image OK')
          "

  ui:
    name: UI (typecheck, tests, quality)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Run tests
        run: npm run test:run
      - name: UI quality gate (contrast + token hygiene)
        run: npm run ui:quality
      # Blocking. The 92-error backlog this was introduced against (mostly
      # eslint-plugin-jsx-a11y and the newer eslint-plugin-react-hooks rules)
      # is cleared, so a new error is a regression rather than a known debt.
      # Warnings still do not fail the build.
      - name: ESLint (correctness + a11y)
        run: npm run lint

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Install docs dependencies
        run: poetry install --with docs
      - name: Build docs
        run: poetry run sphinx-build -W --keep-going docs docs/_build/html

  # Dependency vulnerability audit. Split deliberately: the runtime surface is
  # blocking, the toolchain is advisory. A CVE in `vite` or `eslint` never
  # reaches a user who installed the wheel; one in `axios` or `fastapi` does.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/ui/package-lock.json

      # ── Python ────────────────────────────────────────────────────────────
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Install dependencies
        run: poetry install --extras all --with server
      # Audits the resolved environment, so it covers transitive packages the
      # lockfile pulls in — which is where these almost always live.
      #
      # Blocking: the backlog that kept it advisory (mlflow 2.x, pyarrow 19,
      # pytest 7) is cleared — mlflow ^3.15, pyarrow >=23.0.1, pytest ^9.0.3.
      # `--skip-editable` leaves out Ducta itself, which `poetry install` installs
      # in editable mode and which is not on PyPI to audit; `--strict` would turn
      # that skip into a failure.
      - name: pip-audit (runtime and dev dependencies)
        run: |
          poetry run pip install pip-audit
          poetry run pip-audit --skip-editable

      # ── UI ────────────────────────────────────────────────────────────────
      - name: Install UI dependencies
        working-directory: server/ui
        run: npm ci
      # `--omit=dev` is the point: these are the packages that ship inside
      # the ducta-server wheel (ui_dist) and execute in the user's browser.
      - name: npm audit (shipped UI dependencies)
        working-directory: server/ui
        run: npm audit --omit=dev --audit-level=low
      - name: npm audit (build toolchain — advisory)
        working-directory: server/ui
        run: npm audit --audit-level=high || true

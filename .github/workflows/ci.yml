name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "1.8.3"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      # NOT --all-extras: that would pull in the `databricks` extra, whose
      # databricks-connect overwrites pyspark and breaks every Spark test.
      - name: Install dependencies
        run: poetry install --extras all
      # F rules include F821 (undefined name). A whole module once shipped with
      # 13 undefined names because nothing ran this in CI — keep it blocking.
      - name: Ruff lint
        run: poetry run ruff check src tests
      # The two below are not yet clean (≈94 unformatted files, ≈530 mypy
      # errors). They report without failing the build so the gate can be
      # adopted now; flip each to a hard failure once its backlog reaches zero.
      - name: Ruff format check (advisory)
        run: poetry run ruff format --check src tests || true
      - name: mypy (advisory)
        run: poetry run mypy src/ducta || true

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up JDK (Spark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      # NOT --all-extras: that would pull in the `databricks` extra, whose
      # databricks-connect overwrites pyspark and breaks every Spark test.
      - name: Install dependencies
        run: poetry install --extras all
      - name: Run tests
        run: poetry run pytest --cov=ducta --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # Proves the published artifact is installable from a clean environment on
  # every supported Python — the check that would have caught both the
  # undeclared msgpack dependency and the pyarrow/3.13 wheel gap.
  install-matrix:
    name: Clean install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Build wheel
        run: poetry build
      - name: Install the built wheel with all extras
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[all]"
      # Import every entry point a user hits first. These are plain imports, so
      # any dependency that is used but not declared fails here.
      - name: Smoke-test imports and CLI
        run: |
          /tmp/clean/bin/ducta --version
          /tmp/clean/bin/ducta --help > /dev/null
          /tmp/clean/bin/python - <<'PY'
          import ducta
          from ducta.api.main import create_app
          from ducta.stream.query_manager import StreamingQueryManager
          from ducta.core.executor import PipelineExecutor
          assert "/health" in create_app().openapi()["paths"]
          print("smoke OK", ducta.__version__)
          PY

  ui:
    name: UI (typecheck, tests, quality)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ducta/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ducta/ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Run tests
        run: npm run test:run
      - name: UI quality gate (contrast + token hygiene)
        run: npm run ui:quality
      # Newly adopted (93 errors / 37 warnings baseline, mostly
      # eslint-plugin-jsx-a11y and the newer eslint-plugin-react-hooks
      # rules) — advisory until that backlog is worked down, same pattern
      # as `ruff format`/`mypy` in the lint job above. Flip to a hard
      # failure once the baseline reaches zero.
      - name: ESLint (advisory — correctness + a11y)
        run: npm run lint || true

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Install docs dependencies
        run: poetry install --with docs
      - name: Build docs
        run: poetry run sphinx-build -W --keep-going docs docs/_build/html

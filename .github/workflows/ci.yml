name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "1.8.3"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      # NOT --all-extras: that would pull in the `databricks` extra, whose
      # databricks-connect overwrites pyspark and breaks every Spark test.
      - name: Install dependencies
        run: poetry install --extras all
      # F rules include F821 (undefined name). A whole module once shipped with
      # 13 undefined names because nothing ran this in CI — keep it blocking.
      - name: Ruff lint
        run: poetry run ruff check src tests
      # Blocking since the formatting backlog reached zero. `ruff format` is
      # deterministic, so anything it would rewrite is a diff nobody reviewed —
      # keep it a hard failure rather than let the backlog grow back.
      - name: Ruff format check
        run: poetry run ruff format --check src tests
      # Still advisory: the backlog is ~450 errors, dominated by [union-attr] on
      # the lazily-created SparkSession. Flip to a hard failure once it is zero.
      - name: mypy (advisory)
        run: poetry run mypy src/ducta || true

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # Several tests chdir into a temporary project and spawn worker processes
      # (`run_in_process`, the sweep workers, the template smoke tests).
      # pytest-cov's .pth hook starts coverage inside those children, but from a
      # cwd where this pyproject.toml is not discoverable — so they record
      # statement-only data while the parent records branch data
      # (`[tool.coverage.run] branch = true`). The run then dies in the final
      # combine with "Can't combine statement coverage data with branch data",
      # *after* every test has already passed, which is why the failure reads as
      # a coverage crash rather than a test failure. Pointing every process at
      # the same config file is what makes parent and children agree.
      COVERAGE_RCFILE: ${{ github.workspace }}/pyproject.toml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up JDK (Spark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      # NOT --all-extras: that would pull in the `databricks` extra, whose
      # databricks-connect overwrites pyspark and breaks every Spark test.
      - name: Install dependencies
        run: poetry install --extras all
      - name: Run tests
        run: poetry run pytest --cov=ducta --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # Proves the published artifact is installable from a clean environment on
  # every supported Python — the check that would have caught both the
  # undeclared msgpack dependency and the pyarrow/3.13 wheel gap.
  install-matrix:
    name: Clean install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      # The wheel bundles `src/ducta/ui/dist`, which is gitignored — it only
      # exists once the UI is built. Without this step `poetry build` silently
      # produces a wheel with no web app, and `ducta server start` 404s on `/`
      # for anyone who installs it. Build it here so the artifact under test is
      # the artifact users get.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ducta/ui/package-lock.json
      - name: Build the web app
        working-directory: src/ducta/ui
        run: |
          npm ci
          npm run build
      # Poetry asks *git* what to ignore, and `src/ducta/ui/dist` is gitignored
      # because it is a build artifact. In Poetry 1.8 that veto beats the
      # explicit `include` in pyproject.toml, so `poetry build` silently emits a
      # wheel with no web app — precisely the failure the assertion below exists
      # to catch, and the reason this job has been red. Staging the freshly
      # built assets takes them out of git's ignore set for the rest of this
      # ephemeral checkout; nothing is committed.
      # Delete this step once POETRY_VERSION moves to 2.x, where an explicit
      # `include` wins over the VCS ignore on its own.
      - name: Make the built UI visible to Poetry
        run: git add --force src/ducta/ui/dist

      - name: Build wheel
        run: poetry build
      - name: Assert the wheel bundles the web app
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if not any(n.endswith("ducta/ui/dist/index.html") for n in names):
              sys.exit(f"{wheel} ships no UI: build src/ducta/ui before packaging")
          print(f"{wheel} bundles the web app")
          PY
      - name: Install the built wheel with all extras
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[all]"
      # Import every entry point a user hits first. These are plain imports, so
      # any dependency that is used but not declared fails here.
      - name: Smoke-test imports and CLI
        run: |
          /tmp/clean/bin/ducta --version
          /tmp/clean/bin/ducta --help > /dev/null
          /tmp/clean/bin/python - <<'PY'
          import ducta
          from ducta.api.main import create_app
          from ducta.stream.query_manager import StreamingQueryManager
          from ducta.core.executors import PipelineExecutor
          assert "/health" in create_app().openapi()["paths"]
          print("smoke OK", ducta.__version__)
          PY

  ui:
    name: UI (typecheck, tests, quality)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ducta/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ducta/ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Run tests
        run: npm run test:run
      - name: UI quality gate (contrast + token hygiene)
        run: npm run ui:quality
      # Blocking. The 92-error backlog this was introduced against (mostly
      # eslint-plugin-jsx-a11y and the newer eslint-plugin-react-hooks rules)
      # is cleared, so a new error is a regression rather than a known debt.
      # Warnings still do not fail the build.
      - name: ESLint (correctness + a11y)
        run: npm run lint

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Install docs dependencies
        run: poetry install --with docs
      - name: Build docs
        run: poetry run sphinx-build -W --keep-going docs docs/_build/html

  # Dependency vulnerability audit. Split deliberately: the runtime surface is
  # blocking, the toolchain is advisory. A CVE in `vite` or `eslint` never
  # reaches a user who installed the wheel; one in `axios` or `fastapi` does.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ducta/ui/package-lock.json

      # ── Python ────────────────────────────────────────────────────────────
      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Install dependencies
        run: poetry install --extras all
      # Audits the resolved environment, so it covers transitive packages the
      # lockfile pulls in — which is where these almost always live.
      #
      # Blocking: the backlog that kept it advisory (mlflow 2.x, pyarrow 19,
      # pytest 7) is cleared — mlflow ^3.15, pyarrow >=23.0.1, pytest ^9.0.3.
      # `--skip-editable` leaves out Ducta itself, which `poetry install` installs
      # in editable mode and which is not on PyPI to audit; `--strict` would turn
      # that skip into a failure.
      - name: pip-audit (runtime and dev dependencies)
        run: |
          poetry run pip install pip-audit
          poetry run pip-audit --skip-editable

      # ── UI ────────────────────────────────────────────────────────────────
      - name: Install UI dependencies
        working-directory: src/ducta/ui
        run: npm ci
      # `--omit=dev` is the point: these are the packages that ship inside
      # src/ducta/ui/dist and execute in the user's browser.
      - name: npm audit (shipped UI dependencies)
        working-directory: src/ducta/ui
        run: npm audit --omit=dev --audit-level=low
      - name: npm audit (build toolchain — advisory)
        working-directory: src/ducta/ui
        run: npm audit --audit-level=high || true

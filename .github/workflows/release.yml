name: Release

# Publishes the two packages this repository builds, together and at the same
# version: `ducta` (engine + CLI, the repo root) and `ducta-server` (API + web app,
# server/). One step is invisible by hand — building the web app before packaging
# the server: `server/src/ducta_server/ui_dist` is gitignored, so `poetry build` on
# a clean tree silently produces a server wheel with no UI and no error. This
# workflow makes the whole sequence the only way to ship.
#
#   guard  →  ci (the whole of ci.yml)  →  build  →  publish  →  github-release
#
# PyPI only from a `v*` tag whose version both pyprojects carry; TestPyPI from
# anywhere, by hand (Actions → Release → Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (PyPI only when run from a v* tag)"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

# One release per ref at a time, and never cancelled halfway: a publish cut short
# leaves one package on PyPI without the other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Poetry that writes poetry.lock (format 2.1): 1.8 cannot read it.
  POETRY_VERSION: "2.4.1"

jobs:
  # Cheap checks first, so a release that cannot ship fails in seconds and not
  # after the whole test suite.
  guard:
    name: Check what is being released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PyPI only from a v* tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::publishing to PyPI needs a v* tag (this run is on $GITHUB_REF). Push the tag, or choose testpypi."
          exit 1
      - name: The tag, ducta and ducta-server agree on the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          def version(path):
              with open(path, "rb") as fh:
                  return tomllib.load(fh)["tool"]["poetry"]["version"]
          engine, server = version("pyproject.toml"), version("server/pyproject.toml")
          if not (tag == engine == server):
              sys.exit(f"::error::tag v{tag}, ducta {engine} and ducta-server {server} must agree")
          print(f"tag, ducta and ducta-server agree on {engine}")
          PY

  # Every CI job — lint, mypy, the test matrix, clean installs, Docker images, the
  # web app, the docs and the dependency audit — on the commit being released.
  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/ui/package-lock.json
      - name: Install Poetry
        run: |
          pipx install "poetry==$POETRY_VERSION"
          pipx inject poetry poetry-plugin-export

      - name: Build the web app
        working-directory: server/ui
        run: |
          npm ci
          npm run build

      - name: Build sdists and wheels (ducta, then ducta-server)
        run: |
          poetry build -o dist
          (cd server && poetry build -o ../dist)

      # The failures this workflow exists to prevent. Assert them directly rather
      # than trusting that the steps above ran.
      - name: Assert each wheel carries what it should
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          engine = glob.glob("dist/ducta-[0-9]*.whl")[0]
          leaked = [n for n in zipfile.ZipFile(engine).namelist()
                    if n.startswith(("ducta/api/", "ducta/ui/", "ducta_server/"))]
          if leaked:
              sys.exit(f"{engine} ships server files — refusing to publish: {leaked[:5]}")
          server = glob.glob("dist/ducta_server-*.whl")[0]
          names = zipfile.ZipFile(server).namelist()
          if "ducta_server/ui_dist/index.html" not in names:
              sys.exit(f"{server} ships no UI — refusing to publish")
          assets = [n for n in names if n.startswith("ducta_server/ui_dist/assets/")]
          if not assets:
              sys.exit(f"{server} has index.html but no built assets — refusing to publish")
          print(f"{engine}: engine and CLI; {server}: the web app ({len(assets)} assets)")
          PY

      # Installs exactly the two wheels built above (never a ducta from PyPI) and
      # starts the server as a user would.
      - name: Smoke-test the built wheels
        run: |
          python -m venv /tmp/cli
          /tmp/cli/bin/pip install --upgrade pip
          /tmp/cli/bin/pip install "$(ls dist/ducta-[0-9]*.whl)[all]"
          /tmp/cli/bin/ducta --version

          python -m venv /tmp/server
          /tmp/server/bin/pip install --upgrade pip
          /tmp/server/bin/pip install "$(ls dist/ducta-[0-9]*.whl)" "$(ls dist/ducta_server-*.whl)"
          /tmp/server/bin/python - <<'PY'
          from importlib.metadata import version
          engine, server = version("ducta"), version("ducta-server")
          assert engine == server, f"installed ducta {engine} but ducta-server {server}"
          print("installed ducta and ducta-server", engine)
          PY

          /tmp/server/bin/ducta-server --no-browser --port 8765 > /tmp/server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8765/health > /dev/null 2>&1 && break
            sleep 1
          done
          status=0
          curl -fsS http://127.0.0.1:8765/health || status=1
          echo
          curl -fsS http://127.0.0.1:8765/ | grep -qi "<!doctype html" || { echo "::error::GET / does not serve the web app"; status=1; }
          kill "$pid" || true
          if [ "$status" != 0 ]; then cat /tmp/server.log; exit 1; fi
          echo "smoke OK: the server starts, answers /health and serves the web app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      # The exact versions this release was tested with, one file per Python.
      # pip ignores poetry.lock, so whoever needs a reproducible install passes
      # one with `-c`. Raw `poetry export` output pins numpy twice for 3.13+ and
      # pip refuses it: scripts/constraints.py keeps one version per package.
      # Kept out of dist/: the PyPI upload takes every file there.
      - name: Export the constraints files
        run: |
          poetry export --extras all --with server --without-hashes -o exported.txt
          python -m pip install packaging
          python scripts/constraints.py exported.txt 3.11 3.12 3.13 3.14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: constraints
          path: constraints-py*.txt

  publish:
    name: Publish to ${{ github.event.inputs.target || 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    # Gate publication behind a GitHub Environment so a tag push cannot ship on
    # its own — configure it with required reviewers under Settings →
    # Environments (an environment that does not exist is created unprotected).
    # Trusted publishing (OIDC) means no API token is stored anywhere; register
    # the publisher on PyPI (and TestPyPI) for this repo/workflow — once per
    # project: `ducta` AND `ducta-server` (dist/ holds both, uploaded together).
    environment: ${{ github.event.inputs.target || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # PyPI never accepts a file twice and twine stops at the first refusal, so
      # an upload cut short (e.g. one project without a trusted publisher) can
      # only be completed by skipping what is already there. Both steps.
      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Publish to PyPI
        if: github.event.inputs.target != 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # The GitHub release of the tag: its CHANGELOG section as notes, and the
  # constraints files, so
  #   pip install "ducta[all]==X.Y.Z" "ducta-server==X.Y.Z" -c https://github.com/faustinolopezramos/ducta/releases/download/vX.Y.Z/constraints-py3.13.txt
  # installs what was tested. Only for a tag published to PyPI, after PyPI accepted it.
  github-release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.target != 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: constraints
      - name: Release notes from the CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The lines under "## [X.Y.Z]", up to the next "## [" heading.
          awk -v v="$version" '
            /^## \[/ { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
            on
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $version"
            echo "See CHANGELOG.md." > notes.md
          fi
          printf '\n---\nConstraints for a reproducible install are attached (`pip install … -c constraints-py3.X.txt`).\n' >> notes.md
      - name: Create the release or update it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" constraints-py*.txt --clobber
          else
            gh release create "$TAG" constraints-py*.txt --title "$TAG" --notes-file notes.md
          fi
